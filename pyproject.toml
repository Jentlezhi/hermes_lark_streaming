[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lark-streaming"
version = "1.0.0"
description = "Hermes Gateway 飞书流式卡片插件 — 单卡收敛 · CardKit v2.0 流式 · 进程内零 IPC"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["Hermes", "Feishu", "Lark", "streaming-card", "cardkit"]
license = { text = "MIT" }
dependencies = [
  "lark-oapi>=1.4.0",
  "PyYAML>=6.0",
]

[project.scripts]
hermes-lark-streaming = "hermes_lark_streaming.__main__:main"

# Hermes 官方插件入口。由 pip 写入 site-packages，不在 Hermes 的 git 工作区内，
# 因此 `hermes update` 的 git reset 不会影响它 —— 这是升级免疫的基础。
[project.entry-points."hermes_agent.plugins"]
hermes-lark-streaming = "hermes_lark_streaming.bridge.plugin"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["hermes_lark_streaming*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF002/RUF003：中文注释中的全角标点属于本项目约定，不做 ASCII 化
ignore = ["RUF002", "RUF003", "RUF006"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
